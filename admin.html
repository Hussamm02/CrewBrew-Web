<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:;">
  <title>CrewBrew | Admin Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-black: #050505;
      --color-charcoal-dark: #111111;
      --color-charcoal: #1a1a1a;
      --color-charcoal-light: #262626;
      --color-white: #ffffff;
      --color-gray-text: #a3a3a3;
      --color-gold: #d4af37;
      --color-gold-hover: #e5c358;
      
      --font-family: 'Inter', system-ui, sans-serif;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: var(--font-family);
      background-color: var(--color-black);
      color: var(--color-gray-text);
      background-image: linear-gradient(rgba(5, 5, 5, 0.95), rgba(5, 5, 5, 0.95)), url('coffee_bg.webp');
      background-size: cover;
      background-attachment: fixed;
      line-height: 1.6; 
      -webkit-font-smoothing: antialiased; 
    }

    button { cursor: pointer; border: none; background: none; font-family: inherit; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; height: auto; }

    /* Login Screen */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
    }
    .login-box {
      background-color: rgba(26, 26, 26, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid var(--color-charcoal-light);
      padding: 40px;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    /* Admin Container */
    #admin-app { display: none; }
    
    .admin-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 25px;
      border-bottom: 1px solid var(--color-charcoal-light);
      margin-bottom: 25px;
    }

    .admin-title-group { display: flex; align-items: center; gap: 15px; }
    .admin-title { color: var(--color-gold); font-size: 2rem; font-weight: 700; }
    .backend-status-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
      border-radius: 20px; font-size: 0.8rem; font-weight: 500;
      background: rgba(212, 175, 55, 0.1); border: 1px solid rgba(212, 175, 55, 0.3); color: var(--color-gold);
    }

    /* Tabs */
    .admin-tabs {
      display: flex; gap: 10px; border-bottom: 1px solid var(--color-charcoal-light);
      margin-bottom: 30px; overflow-x: auto;
    }
    .admin-tab-btn {
      padding: 12px 24px; color: var(--color-gray-text); font-weight: 600;
      border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap;
    }
    .admin-tab-btn:hover { color: var(--color-white); }
    .admin-tab-btn.active {
      color: var(--color-gold); border-bottom-color: var(--color-gold);
      background-color: rgba(212, 175, 55, 0.05); border-radius: 4px 4px 0 0;
    }

    /* Stats Grid */
    .admin-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .admin-stat-card {
      background-color: rgba(26, 26, 26, 0.7); border: 1px solid var(--color-charcoal-light);
      border-radius: var(--radius-md); padding: 20px;
    }
    .admin-stat-label { color: var(--color-gray-text); font-size: 0.85rem; text-transform: uppercase; }
    .admin-stat-value { color: var(--color-white); font-size: 1.8rem; font-weight: 700; }

    /* Action Bar */
    .admin-action-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
    
    /* Buttons */
    .btn-primary-gold {
      background-color: var(--color-gold); color: var(--color-black);
      padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 600;
    }
    .btn-primary-gold:hover { background-color: var(--color-gold-hover); transform: translateY(-1px); }
    .btn-outline-gold {
      color: var(--color-gold); border: 1px solid var(--color-gold);
      padding: 9px 18px; border-radius: var(--radius-sm); font-weight: 600;
    }
    .btn-outline-gold:hover { background-color: rgba(212, 175, 55, 0.1); }
    .btn-danger {
      background-color: rgba(239, 68, 68, 0.15); color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 12px; border-radius: var(--radius-sm);
    }
    .btn-danger:hover { background-color: rgba(239, 68, 68, 0.3); }

    /* Tables */
    .admin-table-container { overflow-x: auto; border: 1px solid var(--color-charcoal-light); border-radius: var(--radius-md); background: rgba(18, 18, 18, 0.6); }
    .admin-table { width: 100%; border-collapse: collapse; text-align: left; }
    .admin-table th { background-color: #181818; color: var(--color-gold); font-size: 0.8rem; text-transform: uppercase; padding: 14px 18px; border-bottom: 1px solid var(--color-charcoal-light); }
    .admin-table td { padding: 14px 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: #d1d5db; }
    .table-thumb { width: 48px; height: 48px; border-radius: 4px; object-fit: contain; background: #fff; padding: 2px; }

    /* Stock Badge */
    .stock-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .stock-badge.in-stock { background-color: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
    .stock-badge.out-of-stock { background-color: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }
    .stock-dot { width: 6px; height: 6px; border-radius: 50%; }
    .in-stock .stock-dot { background-color: #22c55e; }
    .out-of-stock .stock-dot { background-color: #ef4444; }

    /* Modals & Forms */
    .admin-modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); z-index: 2000;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .admin-modal-overlay.active { opacity: 1; pointer-events: auto; }
    .admin-modal {
      background: #141414; border: 1px solid var(--color-gold); border-radius: var(--radius-lg);
      max-width: 750px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9); color: var(--color-white);
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-label { font-size: 0.85rem; color: var(--color-gray-text); font-weight: 500; }
    .form-input, .form-select, .form-textarea {
      background-color: #0b0b0b; border: 1px solid var(--color-charcoal-light); color: var(--color-white);
      padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.95rem; font-family: inherit;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--color-gold); }
    
    .file-upload-zone { border: 2px dashed var(--color-charcoal-light); border-radius: var(--radius-md); padding: 20px; text-align: center; background: #0a0a0a; cursor: pointer; }
    .upload-preview { max-height: 120px; object-fit: contain; margin: 10px auto; border-radius: 4px; background: #fff; padding: 4px; }
    .dynamic-row { display: flex; gap: 10px; margin-bottom: 8px; }
    .dynamic-row input { flex: 1; }

    .brand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .brand-card-admin { background: rgba(26,26,26,0.8); border: 1px solid var(--color-charcoal-light); border-radius: var(--radius-md); padding: 20px; display: flex; flex-direction: column; gap: 15px; }
  </style>
</head>
<body>

  <!-- Login Gate -->
  <div id="login-screen">
    <div class="login-box">
      <h1 style="color:var(--color-gold); margin-bottom:20px;">Admin Portal</h1>
      <p style="margin-bottom:30px;" id="login-message">Sign in with your admin credentials to access the dashboard.</p>
      <form id="login-form">
        <input type="email" id="admin-email" class="form-input" placeholder="Enter email" style="width:100%; margin-bottom:15px;" required autofocus />
        <input type="password" id="admin-pass" class="form-input" placeholder="Enter password" style="width:100%; margin-bottom:15px;" required />
        <button type="submit" id="login-btn" class="btn-primary-gold" style="width:100%;">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Admin Application -->
  <div id="admin-app">
    <div class="admin-container">
      <div class="admin-header">
        <div class="admin-title-group">
          <div class="admin-title">CrewBrew Admin Portal</div>
          <div class="backend-status-pill" id="backend-status">
            <span style="width:8px; height:8px; border-radius:50%; background:#eab308;"></span>
            Checking Backend...
          </div>
        </div>
        <div>
          <button class="btn-outline-gold" onclick="window.location.href='index.html'" style="margin-right:10px;">View Storefront</button>
          <button class="btn-primary-gold" onclick="openProductModal()" style="margin-right:10px;">+ Add New Product</button>
          <button class="btn-danger" id="logout-btn">Logout</button>
        </div>
      </div>

      <div class="admin-tabs">
        <button class="admin-tab-btn active" data-tab="overview">Overview</button>
        <button class="admin-tab-btn" data-tab="products">Products Catalog</button>
        <button class="admin-tab-btn" data-tab="brands">Brands</button>
        <button class="admin-tab-btn" data-tab="database">Database & Sync</button>
      </div>

      <div id="admin-tab-content"></div>
    </div>
  </div>

  <!-- Modals -->
  <div class="admin-modal-overlay" id="admin-product-modal">
    <div class="admin-modal">
      <div style="display:flex; justify-content:space-between; margin-bottom:20px; border-bottom:1px solid var(--color-charcoal-light); padding-bottom:15px;">
        <h2 style="color:var(--color-gold);" id="modal-product-title">Add New Product</h2>
        <button style="color:var(--color-gray-text); font-size:1.5rem;" onclick="closeProductModal()">&times;</button>
      </div>
      <form id="product-form">
        <input type="hidden" id="form-prod-id" />
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div class="form-group" style="grid-column:1/-1;">
            <label class="form-label">Product Name *</label>
            <input type="text" id="form-prod-name" class="form-input" required />
          </div>
          <div class="form-group">
            <label class="form-label">Brand *</label>
            <select id="form-prod-brand" class="form-select" required></select>
          </div>
          <div class="form-group">
            <label class="form-label">Category *</label>
            <select id="form-prod-cat" class="form-select" required></select>
          </div>
          <div class="form-group">
            <label class="form-label">Price (JOD) *</label>
            <input type="text" id="form-prod-price" class="form-input" required placeholder="e.g. JOD 85.00" />
          </div>
          <div class="form-group">
            <label class="form-label">Stock Status *</label>
            <select id="form-prod-stock" class="form-select">
              <option value="In Stock">In Stock</option>
              <option value="Out of Stock">Out of Stock</option>
            </select>
          </div>
          <div class="form-group" style="grid-column:1/-1;">
            <label class="form-label">Description</label>
            <textarea id="form-prod-desc" class="form-textarea" rows="3"></textarea>
          </div>
          <div class="form-group" style="grid-column:1/-1;">
            <label class="form-label">Product Image</label>
            <div class="file-upload-zone" onclick="document.getElementById('file-input-prod').click()">
              <div style="color:var(--color-gray-text);">Click to Upload Image File</div>
              <input type="file" id="file-input-prod" accept="image/*" style="display:none;" onchange="handleFileSelected(event)" />
              <img id="image-preview" class="upload-preview" style="display:none;" />
            </div>
            <input type="text" id="form-prod-img-url" class="form-input" style="margin-top:8px;" placeholder="Or paste relative image path" />
          </div>
          
          <div class="form-group" style="grid-column:1/-1;">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
              <label class="form-label">Technical Specifications</label>
              <button type="button" class="btn-outline-gold" style="padding:4px 10px; font-size:0.8rem;" onclick="addSpecRow()">+ Add Spec Row</button>
            </div>
            <div id="specs-builder-container"></div>
          </div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:25px; padding-top:20px; border-top:1px solid var(--color-charcoal-light);">
          <button type="button" class="btn-outline-gold" onclick="closeProductModal()">Cancel</button>
          <button type="submit" id="btn-save-product" class="btn-primary-gold">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <div class="admin-modal-overlay" id="admin-brand-modal">
    <div class="admin-modal" style="max-width:500px;">
      <div style="display:flex; justify-content:space-between; margin-bottom:20px; border-bottom:1px solid var(--color-charcoal-light); padding-bottom:15px;">
        <h2 style="color:var(--color-gold);">Add / Edit Brand</h2>
        <button style="color:var(--color-gray-text); font-size:1.5rem;" onclick="closeBrandModal()">&times;</button>
      </div>
      <form id="brand-form">
        <input type="hidden" id="form-brand-id" />
        <div class="form-group">
          <label class="form-label">Brand Name *</label>
          <input type="text" id="form-brand-name" class="form-input" required />
        </div>
        <div class="form-group">
          <label class="form-label">Brand Image</label>
          <div class="file-upload-zone" onclick="document.getElementById('file-input-brand').click()">
            <div style="color:var(--color-gray-text);">Click to Upload Image File</div>
            <input type="file" id="file-input-brand" accept="image/*" style="display:none;" onchange="handleBrandFileSelected(event)" />
            <img id="brand-image-preview" class="upload-preview" style="display:none;" />
          </div>
          <input type="text" id="form-brand-img" class="form-input" style="margin-top:8px;" placeholder="Or paste relative image path" />
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea id="form-brand-desc" class="form-textarea" rows="2"></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px;">
          <button type="button" class="btn-outline-gold" onclick="closeBrandModal()">Cancel</button>
          <button type="submit" id="btn-save-brand" class="btn-primary-gold">Save Brand</button>
        </div>
      </form>
    </div>
  </div>

  <!-- DB Layer -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="db.js"></script>
  
  <!-- Admin Logic -->
  <script>
    // --- Authentication ---
    let authSub = null;
    async function checkAuth() {
      if (dbService.isSupabaseConfigured() && !authSub) {
        authSub = dbService.subscribeToAuthChanges((event, session) => {
          if (event === 'SIGNED_OUT') {
            document.getElementById('admin-app').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('login-form').reset();
          }
        });
      }

      const msgEl = document.getElementById('login-message');
      const btn = document.getElementById('login-btn');

      if (!dbService.isSupabaseConfigured()) {
        msgEl.textContent = 'Supabase is not configured. Please add your Project URL and Publishable Key to supabase-config.js.';
        msgEl.style.color = '#f87171';
        btn.disabled = true;
        btn.style.opacity = '0.5';
        return;
      }
      
      try {
        const session = await dbService.getCurrentSession();
        if (session) {
          showDashboard();
        }
      } catch (err) {
        msgEl.textContent = 'Session error: ' + err.message;
        msgEl.style.color = '#f87171';
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    }
    
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value;
      const pass = document.getElementById('admin-pass').value;
      const btn = document.getElementById('login-btn');
      
      btn.textContent = 'Signing in...';
      btn.disabled = true;
      try {
        await dbService.login(email, pass);
        showDashboard();
      } catch (err) {
        alert(err.message || 'Login failed');
      } finally {
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await dbService.logout();
      document.getElementById('admin-app').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('login-form').reset();
    });

    function showDashboard() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-app').style.display = 'block';
      initDashboard();
    }

    document.addEventListener('DOMContentLoaded', checkAuth);

    // --- State ---
    let state = { activeTab: 'overview', searchQuery: '', brandFilter: '' };

    function safeImg(src) {
      if (!src) return '';
      if (src.startsWith('data:') || src.startsWith('http://') || src.startsWith('https://')) return src;
      return encodeURI(src);
    }

    // --- Core UI ---
    async function initDashboard() {
      const isSupa = dbService.isSupabaseActive();
      document.getElementById('backend-status').innerHTML = `
        <span style="width:8px; height:8px; border-radius:50%; background:${isSupa ? '#22c55e' : '#eab308'};"></span>
        ${isSupa ? 'Connected to Supabase Cloud' : 'Local Database Active'}
      `;
      
      document.querySelectorAll('.admin-tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          state.activeTab = e.target.dataset.tab;
          renderTabContent();
        });
      });
      renderTabContent();
    }

    function renderStockBadge(stockStatus) {
      const isOut = stockStatus === 'Out of Stock';
      return `
        <div class="stock-badge ${isOut ? 'out-of-stock' : 'in-stock'}">
          <span class="stock-dot"></span>
          ${isOut ? 'Out of Stock' : 'In Stock'}
        </div>
      `;
    }

    async function renderTabContent() {
      const content = document.getElementById('admin-tab-content');
      
      let brands = [], categories = [], products = [];
      try {
        brands = await dbService.getBrands();
        categories = await dbService.getCategories();
        products = await dbService.getProducts();
      } catch (err) {
        content.innerHTML = `
          <div style="background:rgba(255,0,0,0.1); border:1px solid #f87171; padding:20px; border-radius:8px; text-align:center;">
            <h3 style="color:#f87171; margin-bottom:10px;">Error Loading Catalog</h3>
            <p style="color:#fff; margin-bottom:15px;">${err.message}</p>
            <button class="btn-primary-gold" onclick="renderTabContent()">Retry</button>
          </div>
        `;
        return;
      }

      if (state.activeTab === 'overview') {
        const inStock = products.filter(p => (p.stockStatus || p.stock_status) !== 'Out of Stock').length;
        const outStock = products.length - inStock;
        content.innerHTML = `
          <div class="admin-stats-grid">
            <div class="admin-stat-card">
              <div class="admin-stat-label">Total Brands</div>
              <div class="admin-stat-value">${brands.length}</div>
            </div>
            <div class="admin-stat-card">
              <div class="admin-stat-label">Total Products</div>
              <div class="admin-stat-value">${products.length}</div>
            </div>
            <div class="admin-stat-card">
              <div class="admin-stat-label">In Stock Items</div>
              <div class="admin-stat-value" style="color:#4ade80;">${inStock}</div>
            </div>
            <div class="admin-stat-card">
              <div class="admin-stat-label">Out of Stock Items</div>
              <div class="admin-stat-value" style="color:#f87171;">${outStock}</div>
            </div>
          </div>
          <div style="background:rgba(26,26,26,0.6); padding:25px; border-radius:var(--radius-md); border:1px solid var(--color-charcoal-light);">
            <h3 style="color:var(--color-gold); margin-bottom:15px;">Quick Actions</h3>
            <div style="display:flex; gap:15px;">
              <button class="btn-primary-gold" onclick="openProductModal()">+ Add New Product</button>
              <button class="btn-outline-gold" onclick="openBrandModal()">+ Add New Brand</button>
            </div>
          </div>
        `;
      } 
      else if (state.activeTab === 'products') {
        let filtered = products;
        if (state.searchQuery) filtered = filtered.filter(p => p.name.toLowerCase().includes(state.searchQuery.toLowerCase()));
        if (state.brandFilter) filtered = filtered.filter(p => (p.brandId || p.brand_id) === state.brandFilter);

        let rows = filtered.map(p => {
          const brand = brands.find(b => b.id === (p.brandId || p.brand_id)) || { name: 'Unknown' };
          const cat = categories.find(c => c.id === (p.categoryId || p.category_id)) || { name: 'General' };
          const stock = p.stockStatus || p.stock_status || 'In Stock';
          return `
            <tr>
              <td><img src="${safeImg(p.image)}" class="table-thumb" /></td>
              <td style="font-weight:600; color:#fff;">${p.name}</td>
              <td>${brand.name}</td>
              <td>${cat.name}</td>
              <td style="color:var(--color-gold);">${p.price}</td>
              <td><button onclick="toggleStock('${p.id}')" style="background:none; border:none;">${renderStockBadge(stock)}</button></td>
              <td>
                <button class="btn-outline-gold" style="padding:4px 10px; font-size:0.8rem; margin-right:5px;" onclick="openProductModal('${p.id}')">Edit</button>
                <button class="btn-danger" onclick="deleteProduct('${p.id}')">Delete</button>
              </td>
            </tr>
          `;
        }).join('');

        content.innerHTML = `
          <div class="admin-action-bar">
            <div style="display:flex; gap:15px;">
              <input type="text" class="form-input" placeholder="Search products..." style="min-width:250px;" oninput="state.searchQuery = this.value; renderTabContent();" value="${state.searchQuery}" />
              <select class="form-select" onchange="state.brandFilter = this.value; renderTabContent();">
                <option value="">All Brands</option>
                ${brands.map(b => `<option value="${b.id}" ${state.brandFilter === b.id ? 'selected' : ''}>${b.name}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="admin-table-container">
            <table class="admin-table">
              <thead><tr><th>Image</th><th>Name</th><th>Brand</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
              <tbody>${rows || '<tr><td colspan="7" style="text-align:center;">No products found.</td></tr>'}</tbody>
            </table>
          </div>
        `;
      }
      else if (state.activeTab === 'brands') {
        let cards = brands.map(b => {
          const bProducts = products.filter(p => (p.brandId || p.brand_id) === b.id);
          return `
            <div class="brand-card-admin">
              <div style="height:120px; background:#fff; border-radius:4px; display:flex; align-items:center; justify-content:center; padding:10px;">
                <img src="${safeImg(b.image)}" style="max-height:100%; object-fit:contain;" />
              </div>
              <div><h3 style="color:var(--color-gold);">${b.name}</h3><div style="font-size:0.85rem;">${bProducts.length} Products</div></div>
              <div style="display:flex; gap:8px;">
                <button class="btn-outline-gold" style="flex:1;" onclick="openBrandModal('${b.id}')">Edit</button>
                <button class="btn-danger" onclick="deleteBrand('${b.id}')">Delete</button>
              </div>
            </div>
          `;
        }).join('');
        
        content.innerHTML = `<div class="brand-grid">${cards}</div>`;
      }
      else if (state.activeTab === 'database') {
        const cfg = dbService.getSupabaseConfig();
        
        content.innerHTML = `
          <div style="max-width:700px; background:rgba(26,26,26,0.8); padding:30px; border-radius:var(--radius-md); border:1px solid var(--color-charcoal-light);">
            <h3 style="color:var(--color-gold); margin-bottom:20px;">Supabase Integration Status</h3>
            <div style="margin-bottom:20px; padding:15px; border-radius:8px; background:rgba(255,255,255,0.05); border:1px solid #22c55e;">
              <div style="font-weight:bold; margin-bottom:10px;"><span style="color:#22c55e;">✅ Using shared supabase-config.js</span></div>
              <div style="color:var(--color-gray-text); margin-bottom:5px;">URL: ${cfg.url || 'Not configured'}</div>
              <div style="color:var(--color-gray-text); margin-bottom:15px;">Key: ${cfg.key ? '*'.repeat(20) + cfg.key.slice(-4) : 'Not configured'}</div>
              <button class="btn-outline-gold" onclick="testConnection()">Test Connection</button>
              <div id="connection-test-results" style="margin-top:15px; font-size:0.95rem; padding:15px; background:#111; border-radius:6px; display:none; border:1px solid var(--color-charcoal-light);"></div>
            </div>

            <h3 style="color:var(--color-gold); margin-bottom:20px; margin-top:30px;">Storage Setup Status</h3>
            <div style="margin-bottom:20px; padding:15px; border-radius:8px; background:rgba(255,255,255,0.05); border:1px solid #3b82f6;">
              <div style="color:var(--color-gray-text); margin-bottom:5px;">Bucket name: <strong style="color:#fff;">crewbrew-assets</strong></div>
              <div style="color:var(--color-gray-text); margin-bottom:5px;">Storage reachable: <span id="storage-reachable">Checking...</span></div>
              <div style="color:var(--color-gray-text); margin-bottom:15px;">Upload permission: <span id="storage-upload-permission">Checking...</span></div>
              <button class="btn-outline-gold" onclick="testStorage()">Test Storage</button>
              <div id="storage-test-results" style="margin-top:15px; font-size:0.95rem; padding:15px; background:#111; border-radius:6px; display:none; border:1px solid var(--color-charcoal-light);"></div>
            </div>

            <hr style="border:0; border-bottom:1px solid var(--color-charcoal-light); margin:25px 0;" />
            
            <h3 style="color:var(--color-gold); margin-bottom:15px;">Database Tools</h3>
            <div style="display:flex; flex-wrap:wrap; gap:15px; margin-bottom:15px;">
              <button class="btn-outline-gold" onclick="dbService.exportCatalogJson()">Export JSON</button>
              <button class="btn-primary-gold" onclick="uploadLocalCatalog()">Upload Local Catalog to Supabase</button>
              <button class="btn-danger" onclick="if(confirm('Reset DB?')) { dbService.resetToDefaultCatalog(); initDashboard(); }">Reset to Default Catalog</button>
            </div>
            
            <div id="upload-progress" style="display:none; padding:15px; background:rgba(212,175,55,0.1); border:1px solid var(--color-gold); border-radius:6px;">
               <div style="color:var(--color-gold); font-weight:bold; margin-bottom:5px;">Upload in progress...</div>
               <div id="upload-status" style="color:#fff;">Starting upload...</div>
            </div>
          </div>
        `;
        
        window.testConnection = async function() {
          const resEl = document.getElementById('connection-test-results');
          resEl.style.display = 'block';
          resEl.innerHTML = '<span style="color:var(--color-gold);">Testing connection...</span>';
          
          const result = await dbService.testSupabaseConnection(cfg.url, cfg.key);
          
          if (result.success) {
            resEl.innerHTML = `
              <div style="color:#22c55e; font-weight:bold; margin-bottom:5px;">✅ Connection Successful</div>
              <div style="color:#aaa;">Stage: ${result.stage}</div>
              <div style="color:#aaa;">Message: ${result.message}</div>
            `;
          } else {
            resEl.innerHTML = `
              <div style="color:#f87171; font-weight:bold; margin-bottom:5px;">❌ Connection Failed</div>
              <div style="color:#aaa;">Failed at stage: <strong style="color:#fff;">${result.stage}</strong></div>
              <div style="color:#aaa;">Message: ${result.message}</div>
            `;
          }
        };

        window.testStorage = async function() {
          const resEl = document.getElementById('storage-test-results');
          const reachEl = document.getElementById('storage-reachable');
          const upEl = document.getElementById('storage-upload-permission');
          
          resEl.style.display = 'block';
          resEl.innerHTML = '<span style="color:var(--color-gold);">Testing storage...</span>';
          reachEl.textContent = 'Checking...';
          upEl.textContent = 'Checking...';

          const result = await dbService.testStorageAccess();

          if (result.success) {
            reachEl.textContent = 'Yes';
            reachEl.style.color = '#22c55e';
            upEl.textContent = 'Available';
            upEl.style.color = '#22c55e';
            
            resEl.innerHTML = `
              <div style="color:#22c55e; font-weight:bold; margin-bottom:5px;">✅ Storage Ready</div>
              <div style="color:#aaa;">Bucket reachable and upload permission verified.</div>
            `;
            if (result.cleanupWarning) {
              resEl.innerHTML += `<div style="color:#eab308; margin-top:5px;">⚠️ Warning: Cleanup failed. A temporary file may remain.</div>`;
            }
          } else {
            reachEl.textContent = result.stage === 'crewbrew-assets bucket can be retrieved' ? 'No' : (result.stage === 'Upload permission works' ? 'Yes' : 'Error');
            reachEl.style.color = '#f87171';
            upEl.textContent = result.stage === 'Upload permission works' ? 'Not available' : 'Error';
            upEl.style.color = '#f87171';
            
            resEl.innerHTML = `
              <div style="color:#f87171; font-weight:bold; margin-bottom:5px;">❌ Storage Test Failed</div>
              <div style="color:#aaa;">Failed at stage: <strong style="color:#fff;">${result.stage}</strong></div>
              <div style="color:#aaa;">Message: ${result.message}</div>
            `;
            if (result.cleanupWarning) {
              resEl.innerHTML += `<div style="color:#eab308; margin-top:5px;">⚠️ Warning: Cleanup failed. A temporary file may remain.</div>`;
            }
          }
        };
      }
    }

    // --- Actions ---
    window.toggleStock = async function(id) { 
      try { await dbService.toggleProductStock(id); renderTabContent(); }
      catch (err) { alert(err.message); }
    };
    window.deleteProduct = async function(id) { 
      if(confirm('Delete product?')) { 
        try { await dbService.deleteProduct(id); renderTabContent(); }
        catch (err) { alert(err.message); }
      } 
    };
    window.deleteBrand = async function(id) { 
      if(confirm('Delete brand?')) { 
        try { await dbService.deleteBrand(id); renderTabContent(); }
        catch (err) { alert(err.message); }
      } 
    };

    window.uploadLocalCatalog = async function() {
      if(!confirm('Upload local catalog to Supabase?\\n\\nThis will push your local browser data into the cloud.\\n- Records with matching IDs will be updated.\\n- Cloud records with unrelated IDs will NOT be deleted.\\n\\nProceed?')) return;
      
      const progDiv = document.getElementById('upload-progress');
      if (progDiv) progDiv.style.display = 'block';

      try {
        const counts = await dbService.uploadLocalCatalogToSupabase((entity, current, total) => {
          const statusEl = document.getElementById('upload-status');
          if (statusEl) statusEl.textContent = `Uploading ${entity} ${current} of ${total}`;
        });
        alert(`Upload complete!\nBrands: ${counts.brands}\nCategories: ${counts.categories}\nProducts: ${counts.products}\nVariants: ${counts.variants}`);
      } catch (err) {
        alert('Upload failed: ' + err.message);
      } finally {
        if (progDiv) progDiv.style.display = 'none';
      }
    };
    
    let selectedProductFile = null;
    let selectedBrandFile = null;
    let selectedProductPreviewUrl = null;
    let selectedBrandPreviewUrl = null;

    window.handleFileSelected = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (selectedProductPreviewUrl) URL.revokeObjectURL(selectedProductPreviewUrl);
      selectedProductFile = file;
      selectedProductPreviewUrl = URL.createObjectURL(file);
      document.getElementById('image-preview').src = selectedProductPreviewUrl;
      document.getElementById('image-preview').style.display = 'block';
    };

    window.handleBrandFileSelected = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (selectedBrandPreviewUrl) URL.revokeObjectURL(selectedBrandPreviewUrl);
      selectedBrandFile = file;
      selectedBrandPreviewUrl = URL.createObjectURL(file);
      document.getElementById('brand-image-preview').src = selectedBrandPreviewUrl;
      document.getElementById('brand-image-preview').style.display = 'block';
    };

    window.addSpecRow = function(k='', v='') {
      const div = document.createElement('div');
      div.className = 'dynamic-row';
      div.innerHTML = `<input type="text" class="form-input spec-k" placeholder="Key" value="${k}"><input type="text" class="form-input spec-v" placeholder="Value" value="${v}"><button type="button" class="btn-danger" onclick="this.parentElement.remove()">Remove</button>`;
      document.getElementById('specs-builder-container').appendChild(div);
    };

    window.openProductModal = async function(id=null) {
      const brands = await dbService.getBrands();
      const cats = await dbService.getCategories();
      document.getElementById('form-prod-brand').innerHTML = brands.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
      document.getElementById('form-prod-cat').innerHTML = cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      document.getElementById('specs-builder-container').innerHTML = '';
      
      selectedProductFile = null;
      if (selectedProductPreviewUrl) URL.revokeObjectURL(selectedProductPreviewUrl);
      selectedProductPreviewUrl = null;
      document.getElementById('file-input-prod').value = '';
      
      if (id) {
        document.getElementById('modal-product-title').textContent = 'Edit Product';
        const p = await dbService.getProductById(id);
        document.getElementById('form-prod-id').value = p.id;
        document.getElementById('form-prod-name').value = p.name;
        document.getElementById('form-prod-brand').value = p.brandId || p.brand_id;
        document.getElementById('form-prod-cat').value = p.categoryId || p.category_id;
        document.getElementById('form-prod-price').value = p.price;
        document.getElementById('form-prod-stock').value = p.stockStatus || p.stock_status || 'In Stock';
        document.getElementById('form-prod-desc').value = p.description || '';
        document.getElementById('form-prod-img-url').value = p.image || '';
        
        const preview = document.getElementById('image-preview');
        if (p.image) { preview.src = safeImg(p.image); preview.style.display = 'block'; }
        else { preview.style.display = 'none'; }
        
        if (p.specs) { Object.entries(p.specs).forEach(([k,v]) => addSpecRow(k,v)); }
      } else {
        document.getElementById('modal-product-title').textContent = 'Add New Product';
        document.getElementById('product-form').reset();
        document.getElementById('form-prod-id').value = '';
        document.getElementById('image-preview').style.display = 'none';
        addSpecRow('Burrs', 'Stainless Steel');
      }
      document.getElementById('admin-product-modal').classList.add('active');
    };
    
    window.closeProductModal = () => {
      document.getElementById('admin-product-modal').classList.remove('active');
      if (selectedProductPreviewUrl) {
        URL.revokeObjectURL(selectedProductPreviewUrl);
        selectedProductPreviewUrl = null;
      }
    };

    document.getElementById('product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('btn-save-product');
      const originalText = saveBtn.textContent;
      saveBtn.disabled = true;

      try {
        let prodId = document.getElementById('form-prod-id').value;
        if (!prodId) {
          prodId = 'prod-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);
        }

        let imageUrl = document.getElementById('form-prod-img-url').value;
        let uploadedPath = null;
        
        if (selectedProductFile) {
          saveBtn.textContent = 'Uploading image...';
          const uploadRes = await dbService.uploadImage(selectedProductFile, 'product', prodId);
          imageUrl = uploadRes.publicUrl;
          uploadedPath = uploadRes.path;
        }

        saveBtn.textContent = 'Saving product...';

        const specs = {};
        document.querySelectorAll('.dynamic-row').forEach(row => {
          const k = row.querySelector('.spec-k').value.trim();
          const v = row.querySelector('.spec-v').value.trim();
          if (k) specs[k] = v;
        });

        try {
          await dbService.saveProduct({
            id: prodId,
            name: document.getElementById('form-prod-name').value,
            brandId: document.getElementById('form-prod-brand').value,
            categoryId: document.getElementById('form-prod-cat').value,
            price: document.getElementById('form-prod-price').value,
            stockStatus: document.getElementById('form-prod-stock').value,
            description: document.getElementById('form-prod-desc').value,
            image: imageUrl,
            specs
          });
        } catch (dbErr) {
          if (uploadedPath) {
            try {
              await dbService.deleteUploadedImage(uploadedPath);
            } catch (cleanupErr) {
              throw new Error(dbErr.message + "\n\nWarning: Uploaded image could not be cleaned up automatically.");
            }
          }
          throw dbErr;
        }
        
        closeProductModal();
        renderTabContent();
      } catch (err) {
        alert(err.message || 'Error saving product');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = originalText;
      }
    });

    window.openBrandModal = async function(id=null) {
      selectedBrandFile = null;
      if (selectedBrandPreviewUrl) URL.revokeObjectURL(selectedBrandPreviewUrl);
      selectedBrandPreviewUrl = null;
      document.getElementById('file-input-brand').value = '';

      if (id) {
        const b = await dbService.getBrandById(id);
        document.getElementById('form-brand-id').value = b.id;
        document.getElementById('form-brand-name').value = b.name;
        document.getElementById('form-brand-img').value = b.image;
        document.getElementById('form-brand-desc').value = b.description || '';
        
        const preview = document.getElementById('brand-image-preview');
        if (b.image) { preview.src = safeImg(b.image); preview.style.display = 'block'; }
        else { preview.style.display = 'none'; }
      } else {
        document.getElementById('brand-form').reset();
        document.getElementById('form-brand-id').value = '';
        document.getElementById('brand-image-preview').style.display = 'none';
      }
      document.getElementById('admin-brand-modal').classList.add('active');
    };
    
    window.closeBrandModal = () => {
      document.getElementById('admin-brand-modal').classList.remove('active');
      if (selectedBrandPreviewUrl) {
        URL.revokeObjectURL(selectedBrandPreviewUrl);
        selectedBrandPreviewUrl = null;
      }
    };

    document.getElementById('brand-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('btn-save-brand');
      const originalText = saveBtn.textContent;
      saveBtn.disabled = true;

      try {
        const existingBrandId = document.getElementById('form-brand-id').value;
        const isEdit = !!existingBrandId;

        let brandId = existingBrandId;
        const brandNameRaw = document.getElementById('form-brand-name').value;
        if (!brandId) {
          brandId = brandNameRaw.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        }

        // Prevent creating brands that share names with categories
        const categories = await dbService.getCategories();
        const categoryNamesNormalized = categories.map(c => c.name.toLowerCase().replace(/\s+/g, ''));
        categoryNamesNormalized.push('coldbrewcoffee');
        
        const normalizedInput = brandNameRaw.toLowerCase().replace(/\s+/g, '');
        if (categoryNamesNormalized.includes(normalizedInput)) {
           throw new Error('Cannot create a brand that shares a name with a product category.');
        }

        let imageUrl = document.getElementById('form-brand-img').value;
        let uploadedPath = null;
        
        if (selectedBrandFile) {
          saveBtn.textContent = 'Uploading image...';
          try {
            const uploadRes = await dbService.uploadImage(selectedBrandFile, 'brand', brandId);
            imageUrl = uploadRes.publicUrl;
            uploadedPath = uploadRes.path;
          } catch (uploadErr) {
            throw new Error('Unable to upload brand image: ' + uploadErr.message);
          }
        }

        saveBtn.textContent = 'Saving brand...';

        try {
          await dbService.saveBrand({
            id: brandId,
            name: document.getElementById('form-brand-name').value,
            image: imageUrl,
            description: document.getElementById('form-brand-desc').value
          }, isEdit);
          alert('Brand saved successfully.');
        } catch (dbErr) {
          if (uploadedPath) {
            try {
              await dbService.deleteUploadedImage(uploadedPath);
            } catch (cleanupErr) {
              throw new Error(dbErr.message + "\n\nWarning: Uploaded image could not be cleaned up automatically.");
            }
          }
          throw dbErr;
        }

        closeBrandModal();
        renderTabContent();
      } catch (err) {
        alert(err.message || 'Error saving brand');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = originalText;
      }
    });

  </script>
</body>
</html>
